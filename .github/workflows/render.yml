name: Render episode

# Everything runs here — Edge TTS audio, source screenshots, the video render,
# the thumbnail, and the YouTube package — so the author's machine stays light.
# No YouTube upload: CI hands back downloadable artifacts; you download the MP4
# (+ thumbnail + description/chapters/tags) and upload to YouTube yourself.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Path to the episode JSON (its scenes[] drive the Film render)"
        default: "episodes/examples/EP012-housing.json"
        type: string
      codec:
        description: "Video codec"
        default: "h264"
        type: choice
        options: ["h264", "h265", "vp8", "vp9"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" — don't also set
      # "version" here or action-setup errors on the mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg/ffprobe (narration) + libraries Remotion's headless Chrome needs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install narration dependencies
        run: pip install -r tools/narration/requirements.txt

      - name: Install source-card browser (Playwright)
        run: pnpm --filter @ff/sourcecards exec playwright install --with-deps chromium

      # The Film composition is driven by the episode's scenes[] (single source
      # of truth). Extract them to the files the Remotion bundle imports.
      # The Film composition reads scenes.json / timing.json / sources.index.json.
      # (current.json + clips.json are only for the legacy Episode comp and stay
      # as committed — don't overwrite current.json with a scenes-only episode.)
      - name: Prepare episode (scenes are the source of truth)
        run: |
          python - "${{ inputs.episode }}" <<'PY'
          import json, sys, os
          ep = json.load(open(sys.argv[1]))
          json.dump(ep["scenes"], open("render/src/data/scenes.json", "w"), indent=2, ensure_ascii=False)
          thumb = (ep.get("youtube") or {}).get("thumbnail") or {}
          json.dump(thumb, open("render/src/data/thumb.json", "w"), indent=2, ensure_ascii=False)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"EPID={ep['id']}\n")
          print(f"scenes.json: {len(ep['scenes'])} scenes · EPID={ep['id']}")
          PY

      # Narrate with Edge TTS. --intro 0 keeps the audio aligned to the scenes
      # (no leading silence). Voice comes from the episode's voice.voiceId (Brian).
      - name: Narrate with Edge TTS
        run: python tools/narration/synth.py --episode "${{ inputs.episode }}" --intro 0

      - name: Capture source screenshots (varied sources + per-word rects)
        run: node tools/sourcecards/capture.mjs --episode "${{ inputs.episode }}" || echo "(source capture skipped)"

      - name: Render video (Film)
        run: |
          mkdir -p render/out
          pnpm --filter @ff/render exec remotion render Film "out/${EPID}.mp4" --codec="${{ inputs.codec }}"

      - name: Render branded thumbnail
        run: pnpm --filter @ff/render exec remotion still BrandThumbnail out/thumbnail.png

      - name: Build YouTube package (title, description, chapters, tags)
        run: python tools/build_youtube.py --episode "${{ inputs.episode }}"

      - name: Assemble upload bundle
        run: |
          mkdir -p upload/youtube
          cp "render/out/${EPID}.mp4" upload/
          cp render/out/thumbnail.png upload/youtube/
          cp -r "episodes/${EPID}/youtube/"* upload/youtube/ 2>/dev/null || true

      - name: Upload video + YouTube package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.EPID }}-${{ github.run_number }}"
          path: upload/
          retention-days: 14

      - name: Print download link
        run: |
          {
            echo "### ✅ Render complete — ${EPID}"
            echo ""
            echo "**Download:** ${{ steps.upload.outputs.artifact-url }}"
            echo ""
            echo "Unzip, then upload \`${EPID}.mp4\` to YouTube and use the files in \`youtube/\`"
            echo "(thumbnail.png, title.txt, description.md, chapters.txt, tags.txt)."
          } >> "$GITHUB_STEP_SUMMARY"
